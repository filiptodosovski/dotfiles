set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g extended-keys on
set -g extended-keys-format csi-u

set -g prefix C-f
unbind C-b
bind-key C-f send-prefix

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
set -g base-index 1

# Lowercase keys resize panes; uppercase keys select panes.
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind H select-pane -L
bind J select-pane -D
bind K select-pane -U
bind L select-pane -R

bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

# Mouse selection: keep the highlight after release but DON'T auto-copy.
# Press `y` to copy the highlighted text to the clipboard.
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X stop-selection

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

bind-key -r o if-shell "[ -x ~/.local/bin/tmux-sessionizer ] && [ -d ~/.dotfiles/ ]" "run-shell '~/.local/bin/tmux-sessionizer ~/.dotfiles/'" "display-message '~/.dotfiles or tmux-sessionizer missing'"
bind-key -r f if-shell "[ -x ~/.local/bin/tmux-sessionizer ]" "new-window '~/.local/bin/tmux-sessionizer'" "display-message 'tmux-sessionizer missing'"

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
# Continuum adds its autosave hook after the bar sets status-right.
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g status-position bottom

if-shell 'command -v open >/dev/null 2>&1' 'set -g @open "open"' 'set -g @open "xdg-open"'

set -g @resurrect-capture-pane-contents 'on'
# Attach keeps live sessions; starting a server after kill-server starts fresh.
# Saved snapshots remain available through prefix + Ctrl-r.
set -g @continuum-restore 'off'

bind-key -r g if-shell "command -v lazygit >/dev/null 2>&1" "new-window -n lazygit lazygit" "display-message 'lazygit not found'"

# Rounded Undertow status bar with directory and application labels.
set -g status on
set -g status-justify left
set -g status-interval 10
set -g status-style 'bg=default,fg=#78818c'
set -g status-left ''
set -g status-left-length 0
set -g status-right-length 100

# Pi uses a node process with a title beginning with π.
set -g @fit0_program '#{?#{&&:#{==:#{pane_current_command},node},#{m:π*,#{pane_title}}},pi,#{?#{m/r:^(zsh|bash|fish|sh|dash|ksh)$,#{pane_current_command}},shell,#{pane_current_command}}}'
set -g @fit0_program_icon '#{?#{==:#{E:@fit0_program},pi},π,#{?#{==:#{E:@fit0_program},nvim},,#{?#{==:#{E:@fit0_program},node},,}}}'

set -g window-status-style 'bg=default,fg=#78818c,none'
set -g window-status-current-style 'bg=default,fg=#98b0c2,none'
set -g window-status-separator ' '
set -g window-status-format '#[fg=#1a1f26,bg=default]#[fg=#78818c,bg=#1a1f26] #{E:@fit0_program_icon} #{b:pane_current_path} - #{E:@fit0_program} #[fg=#1a1f26,bg=default]'
set -g window-status-current-format '#[fg=#98b0c2,bg=default]#[fg=#0c0e11,bg=#98b0c2,bold,italics] #{E:@fit0_program_icon} #{b:pane_current_path} - #{E:@fit0_program} #[fg=#98b0c2,bg=default,none]'
set -g status-right '#[fg=#1a1f26,bg=default]#[fg=#98b0c2,bg=#1a1f26,none] #(/bin/sh ~/.dotfiles/tmux/status.sh) #[fg=#1a1f26,bg=default] '

set -g pane-border-style 'fg=#2a323c'
set -g pane-active-border-style 'fg=#98b0c2'
set -g message-style 'bg=#1a1f26,fg=#e8ebee'
set -g mode-style 'bg=#98b0c2,fg=#0c0e11'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
