"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 1500
scan_timeout = 30
add_newline = true

format = """
$directory$git_branch$git_status$cmd_duration
$character
"""

[character]
success_symbol = "[>](bold green)"
error_symbol   = "[x](bold red)"
vimcmd_symbol  = "[<](bold green)"

[directory]
read_only = " ro"

[git_branch]
symbol = "git "

[git_status]
ahead       = "↑${count}"
behind      = "↓${count}"
diverged    = "↕↑${ahead_count}↓${behind_count}"
untracked   = "?${count}"
stashed     = "$${count}"
modified    = "!${count}"
staged      = "+${count}"
renamed     = "»${count}"
deleted     = "✘${count}"
conflicted  = "=${count}"
style       = "yellow"
format      = '([\[$all_status$ahead_behind\]]($style) )'
ignore_submodules = true

[git_commit]
tag_symbol = " tag "

[cmd_duration]
min_time = 500

# nodejs is slow when nvm is lazy-loaded; only enable it in the languages profile
[nodejs]
disabled = true

[package]
disabled = true

[gcloud]
disabled = true
