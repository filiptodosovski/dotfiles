# Windows translation of ../aerospace/aerospace.toml for GlazeWM 3.10.1.
# Install as %USERPROFILE%\.glzr\glazewm\config.yaml (on Windows, not WSL).
# See README.md for setup and the AeroSpace features without direct equivalents.

general:
  startup_commands: []
  shutdown_commands: []
  config_reload_commands: []
  focus_follows_cursor: false
  toggle_workspace_on_refocus: false
  cursor_jump:
    enabled: true
    trigger: window_focus
  hide_method: cloak
  show_all_in_taskbar: false

gaps:
  scale_with_dpi: true
  inner_gap: 10px
  outer_gap:
    left: 10px
    bottom: 10px
    top: 10px
    right: 10px

window_behavior:
  initial_state: tiling
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

workspaces:
  - { name: '1', keep_alive: true }
  - { name: '2', keep_alive: true }
  - { name: '3', keep_alive: true }
  - { name: '4', keep_alive: true }
  - { name: '5', keep_alive: true }
  - { name: '6', keep_alive: true }
  - { name: '7', keep_alive: true }
  - { name: '8', keep_alive: true }
  - { name: '9', keep_alive: true }
  - { name: 'B', keep_alive: true }
  - { name: 'D', keep_alive: true }
  - { name: 'I', keep_alive: true }
  - { name: 'M', keep_alive: true }
  - { name: 'O', keep_alive: true }
  - { name: 'R', keep_alive: true }
  - { name: 'T', keep_alive: true }
  - { name: 'V', keep_alive: true }
  - { name: 'W', keep_alive: true }

window_rules:
  # Launchers and overlays should retain their own positioning.
  - commands: ['ignore']
    match:
      - window_process: { regex: '(?i)^(zebar|raycast|powertoys\.powerlauncher)$' }
      - window_title: { equals: 'Command Palette' }
        window_class: { equals: 'WinUIDesktopWin32WindowClass' }
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }

  # Process names omit .exe. Assign once when a new window is managed;
  # changing the title must not undo a later manual workspace move.
  - commands: ['move --workspace T']
    on: ['manage']
    run_once: true
    match:
      - window_process: { regex: '(?i)^(wezterm-gui|wezterm)$' }
  - commands: ['move --workspace W']
    on: ['manage']
    run_once: true
    match:
      - window_process: { regex: '(?i)^(chrome|firefox|msedge)$' }
  - commands: ['move --workspace D']
    on: ['manage']
    run_once: true
    match:
      - window_process: { regex: '(?i)^(code|code - insiders|webstorm64|webstorm)$' }
  - commands: ['move --workspace B']
    on: ['manage']
    run_once: true
    match:
      - window_process: { regex: '(?i)^(slack|discord)$' }
  - commands: ['move --workspace M']
    on: ['manage']
    run_once: true
    match:
      - window_process: { regex: '(?i)^zoom$' }

keybindings:
  # Alt+/ changes the local tiling direction; accordion has no equivalent.
  - bindings: ['alt+oem_question']
    commands: ['toggle-tiling-direction']

  - bindings: ['alt+h']
    commands: ['focus --direction left']
  - bindings: ['alt+j']
    commands: ['focus --direction down']
  - bindings: ['alt+k']
    commands: ['focus --direction up']
  - bindings: ['alt+l']
    commands: ['focus --direction right']

  - bindings: ['alt+shift+h']
    commands: ['move --direction left']
  - bindings: ['alt+shift+j']
    commands: ['move --direction down']
  - bindings: ['alt+shift+k']
    commands: ['move --direction up']
  - bindings: ['alt+shift+l']
    commands: ['move --direction right']

  # Width replaces AeroSpace smart resize. Service -> S gives both axes.
  - bindings: ['alt+shift+oem_minus']
    commands: ['resize --width -50px']
  - bindings: ['alt+shift+oem_plus']
    commands: ['resize --width +50px']

  - bindings: ['alt+1']
    commands: ['focus --workspace 1']
  - bindings: ['alt+2']
    commands: ['focus --workspace 2']
  - bindings: ['alt+3']
    commands: ['focus --workspace 3']
  - bindings: ['alt+4']
    commands: ['focus --workspace 4']
  - bindings: ['alt+5']
    commands: ['focus --workspace 5']
  - bindings: ['alt+6']
    commands: ['focus --workspace 6']
  - bindings: ['alt+7']
    commands: ['focus --workspace 7']
  - bindings: ['alt+8']
    commands: ['focus --workspace 8']
  - bindings: ['alt+9']
    commands: ['focus --workspace 9']
  - bindings: ['alt+b']
    commands: ['focus --workspace B']
  - bindings: ['alt+v']
    commands: ['focus --workspace V']
  - bindings: ['alt+m']
    commands: ['focus --workspace M']
  - bindings: ['alt+t']
    commands: ['focus --workspace T']
  - bindings: ['alt+w']
    commands: ['focus --workspace W']
  - bindings: ['alt+r']
    commands: ['focus --workspace R']
  - bindings: ['alt+d']
    commands: ['focus --workspace D']
  - bindings: ['alt+o']
    commands: ['focus --workspace O']
  - bindings: ['alt+i']
    commands: ['focus --workspace I']

  # Send the window without following it, matching move-node-to-workspace.
  - bindings: ['alt+shift+1']
    commands: ['move --workspace 1']
  - bindings: ['alt+shift+2']
    commands: ['move --workspace 2']
  - bindings: ['alt+shift+3']
    commands: ['move --workspace 3']
  - bindings: ['alt+shift+4']
    commands: ['move --workspace 4']
  - bindings: ['alt+shift+5']
    commands: ['move --workspace 5']
  - bindings: ['alt+shift+6']
    commands: ['move --workspace 6']
  - bindings: ['alt+shift+7']
    commands: ['move --workspace 7']
  - bindings: ['alt+shift+8']
    commands: ['move --workspace 8']
  - bindings: ['alt+shift+9']
    commands: ['move --workspace 9']
  - bindings: ['alt+shift+b']
    commands: ['move --workspace B']
  - bindings: ['alt+shift+v']
    commands: ['move --workspace V']
  - bindings: ['alt+shift+m']
    commands: ['move --workspace M']
  - bindings: ['alt+shift+t']
    commands: ['move --workspace T']
  - bindings: ['alt+shift+w']
    commands: ['move --workspace W']
  - bindings: ['alt+shift+r']
    commands: ['move --workspace R']
  - bindings: ['alt+shift+d']
    commands: ['move --workspace D']
  - bindings: ['alt+shift+o']
    commands: ['move --workspace O']
  - bindings: ['alt+shift+i']
    commands: ['move --workspace I']

  - bindings: ['alt+shift+f']
    commands: ['toggle-fullscreen']

  # This intentionally replaces Windows Alt+Tab, as on the Mac.
  # Alt+` is an extra shortcut if Windows reserves Alt+Tab on your laptop.
  - bindings: ['alt+tab', 'alt+oem_tilde']
    commands: ['focus --recent-workspace']

  # Directional approximation: monitor to the right, without wraparound.
  - bindings: ['alt+shift+tab']
    commands: ['move-workspace --direction right']

  - bindings: ['alt+shift+oem_semicolon']
    commands: ['wm-enable-binding-mode --name service']

  # Extra recovery keys; Alt+Shift+R remains assigned to workspace R.
  - bindings: ['ctrl+alt+shift+r']
    commands: ['wm-reload-config']
  - bindings: ['alt+shift+p']
    commands: ['wm-toggle-pause']

binding_modes:
  - name: service
    keybindings:
      - bindings: ['escape']
        commands: ['wm-disable-binding-mode --name service', 'wm-reload-config']
      - bindings: ['enter']
        commands: ['wm-disable-binding-mode --name service']
      # Redraw repairs positioning; it does not flatten the layout tree.
      - bindings: ['r']
        commands: ['wm-redraw', 'wm-disable-binding-mode --name service']
      - bindings: ['f']
        commands: ['toggle-floating --centered', 'wm-disable-binding-mode --name service']
      - bindings: ['s']
        commands: ['wm-disable-binding-mode --name service', 'wm-enable-binding-mode --name resize']
      # Choose another monitor direction when right is not appropriate.
      - bindings: ['left']
        commands: ['move-workspace --direction left', 'wm-disable-binding-mode --name service']
      - bindings: ['right']
        commands: ['move-workspace --direction right', 'wm-disable-binding-mode --name service']
      - bindings: ['up']
        commands: ['move-workspace --direction up', 'wm-disable-binding-mode --name service']
      - bindings: ['down']
        commands: ['move-workspace --direction down', 'wm-disable-binding-mode --name service']
      - bindings: ['alt+shift+p']
        commands: ['wm-toggle-pause']
      # No direct join-with or close-all-windows-but-current command.

  - name: resize
    keybindings:
      - bindings: ['h', 'left']
        commands: ['resize --width -50px']
      - bindings: ['l', 'right']
        commands: ['resize --width +50px']
      - bindings: ['j', 'down']
        commands: ['resize --height -50px']
      - bindings: ['k', 'up']
        commands: ['resize --height +50px']
      - bindings: ['escape', 'enter']
        commands: ['wm-disable-binding-mode --name resize']
      - bindings: ['alt+shift+p']
        commands: ['wm-toggle-pause']
